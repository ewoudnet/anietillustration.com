name: Deploy naar aniet.nl

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Composer install (productie)
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: src/vendor/logs isoleren in anietillustration-core/
        # We deployen naar de root van public_html (naast bestaande, losstaande projecten
        # als backoffice/ en advent/ met hun eigen "*-core"-sibling-map). src/ en vendor/
        # mogen daarom NOOIT als vendor/ of src/ in die root belanden: dat zijn generieke
        # namen die de "sibling van public/"-fallback-candidate van die andere projecten'
        # eigen bootstrap.php's shaduwen (dezelfde candidate-zoeklogica als hieronder),
        # waardoor die andere sites hun eigen klassen niet meer vinden. Verplaatsen naar de
        # eigen, uniek genoemde anietillustration-core/ voorkomt dat en matcht candidate 2
        # in backend/bootstrap.php en specials/bootstrap.php.
        run: |
          mkdir -p anietillustration-core
          mv src vendor logs anietillustration-core/
          cp deploy-htaccess-core.txt anietillustration-core/.htaccess

      - name: SFTP deploy
        # timeout-minutes vangt het geval af waarin lftp tóch blijft hangen op een
        # plek die de net:*-instellingen hieronder niet dekken - zonder dit blijft
        # een job in het ergste geval 6 uur (de GitHub-standaard) draaien.
        timeout-minutes: 15
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cat > deploy.lftp <<EOF
          set sftp:auto-confirm yes
          # Zonder deze drie probeert lftp een mislukte verbinding oneindig opnieuw
          # zonder iets te loggen: op 2026-08-12 leverde dat 27 minuten volledige
          # stilte op voordat de job handmatig afgebroken werd. Nu faalt hij na
          # ~1 minuut met een leesbare foutmelding in plaats van te blijven hangen.
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          open -u "$SFTP_USER","$SFTP_PASS" sftp://ftp.aniet.nl:22
          mirror -R --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob docs/ --exclude-glob sql/ --exclude-glob "*.log" --exclude-glob .env --exclude-glob .env.example --exclude-glob CLAUDE.md --exclude-glob composer.json --exclude-glob composer.lock --exclude-glob deploy-htaccess-core.txt --exclude-glob "README*" ./ .
          bye
          EOF
          lftp -f deploy.lftp

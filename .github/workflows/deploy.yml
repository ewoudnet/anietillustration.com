name: Deploy naar aniet.nl

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Composer install (productie)
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: Vendor-map afschermen
        run: cp deploy-htaccess-core.txt vendor/.htaccess

      - name: SFTP deploy
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cat > deploy.lftp <<EOF
          set sftp:auto-confirm yes
          open -u "$SFTP_USER","$SFTP_PASS" sftp://ftp.aniet.nl:22
          mirror -R --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob docs/ --exclude-glob sql/ --exclude-glob "*.log" --exclude-glob .env --exclude-glob .env.example --exclude-glob CLAUDE.md --exclude-glob composer.json --exclude-glob composer.lock --exclude-glob deploy-htaccess-core.txt --exclude-glob "README*" ./ /home/ns122651/domains/aniet.nl/public_ftp/anietillustration.com/
          bye
          EOF
          lftp -f deploy.lftp
